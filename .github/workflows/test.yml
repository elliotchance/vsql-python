name: Test

# Pull requests are tested before they're squash merged, so main isn't built
# again, and a change that's only to documentation isn't tested.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE

jobs:
  test:
    name: ${{ matrix.os }} (${{ matrix.arch }}), Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [Linux, macOS, Windows]
        arch: [x86-64, ARM64]
        python: ["3.9", "3.14"]
        include:
          # ubuntu-latest (26.04) has no Python 3.9.
          - { os: Linux, arch: x86-64, runner: ubuntu-24.04 }
          - { os: Linux, arch: ARM64, runner: ubuntu-24.04-arm }
          - { os: macOS, arch: x86-64, runner: macos-15-intel }
          - { os: macOS, arch: ARM64, runner: macos-latest }
          - { os: Windows, arch: x86-64, runner: windows-latest }
          - { os: Windows, arch: ARM64, runner: windows-11-arm }
          # Free-threaded Python.
          - { os: Linux, arch: x86-64, runner: ubuntu-24.04, python: "3.14t" }
        exclude:
          # Python for Windows on ARM64 starts at 3.11.
          - { os: Windows, arch: ARM64, python: "3.9" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install . pytest
      - run: pytest -v tests
      - run: python example/main.py
      # The type hints (__init__.pyi) match the module, and the example passes
      # mypy --strict with them.
      - if: matrix.os == 'Linux' && matrix.arch == 'x86-64' && matrix.python == '3.14'
        run: |
          pip install mypy
          python -m mypy.stubtest vsql --ignore-missing-stub
          mypy --strict example/main.py

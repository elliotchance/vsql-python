name: Release

# Wheels are built for each push to main (and pull request), and published to
# PyPI (with trusted publishing) when a GitHub release is published. The
# version is the release's tag (v1.2.3 is 1.2.3), from setuptools-scm, so the
# full git history is checked out.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  wheels:
    name: Wheels for ${{ matrix.os }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: Linux, arch: x86-64, runner: ubuntu-latest }
          - { os: Linux, arch: ARM64, runner: ubuntu-24.04-arm }
          - { os: macOS, arch: x86-64, runner: macos-15-intel }
          - { os: macOS, arch: ARM64, runner: macos-latest }
          - { os: Windows, arch: x86-64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pypa/cibuildwheel@v4.3.1
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    # Only a published GitHub release with a version tag (such as v1.0.0) is
    # published to PyPI. Pushes and pull requests only build.
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vsql-python
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.2

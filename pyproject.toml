[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "vsql-python"
# The version is the git tag (such as v1.0.0), see [tool.setuptools_scm].
dynamic = ["version"]
description = "A DB-API 2.0 (PEP 249) driver for vsql, a single file or in-memory SQL database."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "internal/amalgamation/LICENSE", "internal/amalgamation/LICENSE-V"]
requires-python = ">=3.9"
authors = [{ name = "Elliot Chance", email = "elliotchance@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
]

[project.urls]
Homepage = "https://github.com/elliotchance/vsql-python"
vsql = "https://github.com/elliotchance/vsql"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["vsql"]

[tool.setuptools.package-data]
vsql = ["py.typed", "*.pyi"]

[tool.setuptools_scm]
# For a build without the git history (such as a copy of the repository).
fallback_version = "0.0.0"

[tool.cibuildwheel]
# CPython only, including the free-threaded builds (which cibuildwheel builds
# by default from 3.14t).
build = "cp3*"
test-requires = ["pytest"]
test-command = "pytest {project}/tests"

[tool.cibuildwheel.linux]
archs = ["native"]

[tool.cibuildwheel.macos]
archs = ["native"]

[tool.cibuildwheel.windows]
# The runner's own architecture, x86-64 or ARM64 (libvsql doesn't support 32
# bit).
archs = ["native"]

[tool.coverage.run]
branch = true
source = ["vsql"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
